  /roles/{id}/share-grants:
    post:
      tags:
        - Role sharing
      summary: Create a share grant for a role
      description: |
        Grants the role to other organization unit(s). `ouId` selects the organization unit
        performing this share; it defaults to the role's own owning organization unit when
        omitted. Exactly one of two target-scope modes must be selected:

        - **Root-targeting** (`allRoots`, or an explicit `rootOuIds` list; a Root is an
          organization unit with no parent): the only mode that crosses from the owning
          organization unit's own subtree into a different one. Only valid when `ouId` is the
          role's own owning organization unit. `allRoots` optionally takes `excludedRootOuIds`,
          carving specific Root organization units (and their entire subtrees) out of an otherwise
          blanket share, e.g. "share to all Roots except this one".
        - **Children-targeting** (`allChildren`, dynamic — organization units created afterward are
          automatically in scope with no need to call again — or an explicit `ouIds` list of
          `ouId`'s direct children only; reaching a grandchild selectively requires that child to
          issue its own children-targeting call in turn): redistributes the role from `ouId` into
          `ouId`'s own subtree. Valid for any `ouId` currently visible for the role: the role's own
          owning organization unit (always trivially visible to itself, so an owner may use this
          mode directly in one call with no preceding root-targeting call), or any other
          organization unit already made visible by an earlier call to this same action — a sharee
          resharing what was shared to it is not a different action, it is this exact same call and
          the exact same visibility rule. `allChildren` optionally takes `excludedOuIds`, carving
          specific organization units (and their entire subtrees) out of an otherwise blanket
          share, e.g. "share to all children except these".

        `editableFields` sets which templated fields the target organization unit(s) may edit
        (see the "Role sharing" tag description above for the full default/scope-down rules).
        Omit it for "everything ouId itself is allowed to grant".

        Returns the created grant(s). To list or revoke existing grants, see the `GET` and
        `DELETE` operations on this same path.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareRequest'
            examples:
              selected-roots:
                summary: Owner shares to specific Root organization units
                value:
                  rootOuIds:
                    - "6f5e4d3c-2b1a-4c5d-8e9f-0a1b2c3d4e5f"
              all-roots-except:
                summary: Owner shares to all Roots except some
                value:
                  allRoots: true
                  excludedRootOuIds:
                    - "9c2e1a5c-2b1e-4f0a-8c1a-5a6b7c8d9e0f"
              owner-single-call:
                summary: Owner shares directly to its own children, in one call, no prior grant
                value:
                  allChildren: true
              all-children-except:
                summary: An already-visible organization unit shares to all its children except some
                value:
                  ouId: "6f5e4d3c-2b1a-4c5d-8e9f-0a1b2c3d4e5f"
                  allChildren: true
                  excludedOuIds:
                    - "9c2e1a5c-2b1e-4f0a-8c1a-5a6b7c8d9e0f"
              selected-immediate-children:
                summary: Share to specific direct children only (a grandchild must share again)
                value:
                  ouId: "6f5e4d3c-2b1a-4c5d-8e9f-0a1b2c3d4e5f"
                  ouIds:
                    - "9c2e1a5c-2b1e-4f0a-8c1a-5a6b7c8d9e0f"
              reshare-narrower-editability:
                summary: A sharee reshares further, narrowing editability to a subset of its own
                value:
                  ouId: "6f5e4d3c-2b1a-4c5d-8e9f-0a1b2c3d4e5f"
                  ouIds:
                    - "9c2e1a5c-2b1e-4f0a-8c1a-5a6b7c8d9e0f"
                  editableFields:
                    - "assignments.group"
      responses:
        "201":
          description: Share grant(s) created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareGrantListResponse'
              example:
                grants:
                  - id: "1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d"
                    stage: "share"
                    targetScope: "root"
                    targetOuId: "6f5e4d3c-2b1a-4c5d-8e9f-0a1b2c3d4e5f"
                    owningOuId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
                    editableFields:
                      - "assignments"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid-request-format:
                  summary: |
                    Neither target-scope mode selected, both selected, or an invalid request body
                  value:
                    code: "SHR-1001"
                    message:
                      key: "error.sharingservice.invalid_request_format"
                      defaultValue: "Invalid request format"
                    description:
                      key: "error.sharingservice.invalid_request_format_description"
                      defaultValue: "The request body is malformed or contains invalid data"
                invalid-target-ou:
                  summary: |
                    A rootOuIds entry is not itself a Root organization unit, or an ouIds entry is
                    not ouId's direct child (e.g. a grandchild, or a Root)
                  value:
                    code: "SHR-1004"
                    message:
                      key: "error.sharingservice.invalid_target_ou"
                      defaultValue: "Invalid target organization unit"
                    description:
                      key: "error.sharingservice.invalid_target_ou_description"
                      defaultValue: "The target organization unit does not satisfy the sharing policy's constraints"
                non-owner-root-targeting:
                  summary: ouId used root-targeting mode but is not the role's own owning organization unit
                  value:
                    code: "SHR-1004"
                    message:
                      key: "error.sharingservice.invalid_target_ou"
                      defaultValue: "Invalid target organization unit"
                    description:
                      key: "error.sharingservice.invalid_target_ou_description"
                      defaultValue: "The target organization unit does not satisfy the sharing policy's constraints"
                not-shared:
                  summary: |
                    ouId used children-targeting mode but is not the role's owner and has no grant
                    making it visible
                  value:
                    code: "SHR-1005"
                    message:
                      key: "error.sharingservice.not_shared"
                      defaultValue: "Resource not shared to this organization unit"
                    description:
                      key: "error.sharingservice.not_shared_description"
                      defaultValue: "The resource has not been shared or reshared to the given organization unit"
                field-not-templated:
                  summary: An editableFields entry is not "assignments" or one of the assignments.* fields
                  value:
                    code: "SHR-1006"
                    message:
                      key: "error.sharingservice.field_not_templated"
                      defaultValue: "Field is not a templated field"
                    description:
                      key: "error.sharingservice.field_not_templated_description"
                      defaultValue: "The given field is not declared as a templated field for this resource type"
                editability-cannot-be-expanded:
                  summary: |
                    A reshare's editableFields names a field ouId cannot itself currently edit
                  value:
                    code: "SHR-1008"
                    message:
                      key: "error.sharingservice.editability_cannot_be_expanded"
                      defaultValue: "Editability cannot be expanded on reshare"
                    description:
                      key: "error.sharingservice.editability_cannot_be_expanded_description"
                      defaultValue: "A reshare may only narrow which templated fields are editable relative to what the acting organization unit itself currently holds, never widen it"
        "404":
          description: Role not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "ROL-1003"
                message:
                  key: "error.roleservice.role_not_found"
                  defaultValue: "Role not found"
                description:
                  key: "error.roleservice.role_not_found_description"
                  defaultValue: "The role with the specified id does not exist"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "ROL-5000"
                message:
                  key: "error.internal_server_error"
                  defaultValue: "Internal server error"
                description:
                  key: "error.internal_server_error_description"
                  defaultValue: "An unexpected error occurred while processing the request"
    get:
      tags:
        - Role sharing
      summary: List share grants for a role
      description: |
        Returns every grant recorded for the role. `stage` records who issued each grant, not
        which target-scope mode it used: `share` for a grant issued by the role's own owning
        organization unit (root-targeting is always this stage; children-targeting is too, when the
        owner distributes directly into its own subtree), `reshare` for a grant issued by a
        previously-visible sharee organization unit distributing further within its own subtree.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of share grants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareGrantListResponse'
              example:
                grants:
                  - id: "1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d"
                    stage: "share"
                    targetScope: "root"
                    targetOuId: "6f5e4d3c-2b1a-4c5d-8e9f-0a1b2c3d4e5f"
                    owningOuId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
                    editableFields:
                      - "assignments"
                  - id: "2b3c4d5e-6f7a-8b9c-0d1e-2f3a4b5c6d7e"
                    stage: "reshare"
                    targetScope: "all_children"
                    targetOuId: "6f5e4d3c-2b1a-4c5d-8e9f-0a1b2c3d4e5f"
                    owningOuId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
                    excludedOuIds:
                      - "9c2e1a5c-2b1e-4f0a-8c1a-5a6b7c8d9e0f"
                    editableFields:
                      - "assignments.group"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "ROL-5000"
                message:
                  key: "error.internal_server_error"
                  defaultValue: "Internal server error"
                description:
                  key: "error.internal_server_error_description"
                  defaultValue: "An unexpected error occurred while processing the request"

  /roles/{id}/share-grants/{grantId}:
    delete:
      tags:
        - Role sharing
      summary: Revoke a share or reshare grant
      description: |
        Revokes the grant and any reshare grants that derive from it. Every organization unit
        that loses access as a result has its own assignments for the role deleted, so it does
        not retain a stale, permanent permission grant. Revoking a "share to all Roots" grant
        only stops it from governing future reshares and assignments. It does not retroactively
        enumerate and purge every Root organization unit's existing assignments.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: grantId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Grant revoked
        "404":
          description: Share grant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "SHR-1003"
                message:
                  key: "error.sharingservice.grant_not_found"
                  defaultValue: "Share grant not found"
                description:
                  key: "error.sharingservice.grant_not_found_description"
                  defaultValue: "The share grant with the specified id does not exist"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "ROL-5000"
                message:
                  key: "error.internal_server_error"
                  defaultValue: "Internal server error"
                description:
                  key: "error.internal_server_error_description"
                  defaultValue: "An unexpected error occurred while processing the request"

  /roles/{id}/editable-fields:
    get:
      tags:
        - Role sharing
      summary: Get templated fields editable by an organization unit
      description: |
        Returns the templated fields (`assignments` and/or the `assignments.*` types) currently
        editable by `ouId` for this role: every declared field when `ouId` is the role's own owning
        organization unit, or whichever fields the grant that makes the role visible to `ouId`
        allows, for a sharee. See the "Role sharing" tag description for how a grant's
        `editableFields` is decided at share time.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: ouId
          required: false
          description: |
            The organization unit to resolve editability for. Optional; defaults to the role's own
            owning organization unit when omitted.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Editable fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditableFieldsResponse'
              example:
                fields:
                  - "assignments.group"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "ROL-1023"
                message:
                  key: "error.roleservice.role_outside_own_ou_scope"
                  defaultValue: "Outside the caller's organization unit scope"
                description:
                  key: "error.roleservice.role_outside_own_ou_scope_description"
                  defaultValue: "The system:roles scope confines the caller to its own token-issued organization unit; the requested organization unit is outside that scope"
        "404":
          description: Role not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "ROL-1003"
                message:
                  key: "error.roleservice.role_not_found"
                  defaultValue: "Role not found"
                description:
                  key: "error.roleservice.role_not_found_description"
                  defaultValue: "The role with the specified id does not exist"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "ROL-5000"
                message:
                  key: "error.internal_server_error"
                  defaultValue: "Internal server error"
                description:
                  key: "error.internal_server_error_description"
                  defaultValue: "An unexpected error occurred while processing the request"

components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://localhost:8090/oauth2/authorize
          tokenUrl: https://localhost:8090/oauth2/token
          scopes:
            system: Access to system management APIs
            system:roles: |
              Full access to the Role Management API, confined to the token's own organization
              unit (see the "Roles" tag description)
            system:roles:view: |
              Read-only access to the Role Management API, confined to the token's own
              organization unit (see the "Roles" tag description)
        clientCredentials:
          tokenUrl: https://localhost:8090/oauth2/token
          scopes:
            system: Access to system management APIs
            system:roles: |
              Full access to the Role Management API, confined to the token's own organization
              unit (see the "Roles" tag description)
            system:roles:view: |
              Read-only access to the Role Management API, confined to the token's own
              organization unit (see the "Roles" tag description)

  parameters:
    limitQueryParam:
      in: query
      name: limit
      required: false
      description: |
        Maximum number of records to return.
      schema:
        type: integer
        minimum: 1
        default: 30
    offsetQueryParam:
      in: query
      name: offset
      required: false
      description: |
        Number of records to skip for pagination.
      schema:
        type: integer
        minimum: 0
        default: 0
    assigneeTypeQueryParam:
      in: query
      name: type
      required: false
      schema:
        type: string
        enum:
          - user
          - group
          - app
          - agent
      description: |
        Filter assignments by assignee type. When omitted, assignments of all types are returned.
    includeQueryParam:
      in: query
      name: include
      required: false
      schema:
        type: string
        enum:
          - display
      description: |
        Optional parameter to include additional information.
        - `display` - Include display names for users and groups. For users, the display value is resolved from the schema-configured display attribute (`systemAttributes.display`). Falls back to the user ID if no display attribute is configured, the configured attribute path does not exist in the user's data, or the attribute value is empty. For groups, the group name is used.
    ouIdListingQueryParam:
      in: query
      name: ouId
      required: false
      schema:
        type: string
        format: uuid
      description: |
        Organization unit to list roles for. When present, the response includes both roles
        owned by this organization unit and roles shared to it, each tagged with `origin`. When
        absent, the deployment-wide listing is returned (no `origin` tag).
    ouIdActingQueryParam:
      in: query
      name: ouId
      required: false
      schema:
        type: string
        format: uuid
      description: |
        The organization unit to act as when reading or writing the role's `assignments`. Empty
        (the default) means the role's owning organization unit. This preserves prior behavior
        for every caller that doesn't participate in sharing. A non-empty value identifies a
        sharee organization unit acting on its own assignments: for writes (add/remove), the role
        must currently be shared to it, and, for every distinct assignee type present in the
        request, the matching `assignments.*` field must be editable for it (see the "Role
        sharing" section); otherwise the whole request is rejected. For reads, an organization
        unit with no assignments of its own simply sees an empty list.
  schemas:
    Assignment:
      type: object
      required: [id, type]
      properties:
        id:
          type: string
          format: uuid
          description: "ID of the user, app, agent, or group being assigned"
        type:
          type: string
          enum:
            - user
            - group
            - app
            - agent
          description: "Type of entity being assigned (user, app, agent, or group)"
        display:
          type: string
          readOnly: true
          description: "Display name of the user or group (only included when include=display query parameter is used). For users, resolved from the schema-configured display attribute; falls back to the user ID if the attribute is not configured, the path does not exist, or the value is empty. For groups, the group name is used."

    AssignmentInput:
      type: object
      required: [id, type]
      properties:
        id:
          type: string
          format: uuid
          description: "ID of the user, app, agent, or group being assigned"
        type:
          type: string
          enum:
            - user
            - group
            - app
            - agent
          description: "Type of entity being assigned (user, app, agent, or group)"

    ResourcePermissions:
      type: object
      required: [resourceServerId, permissions]
      properties:
        resourceServerId:
          type: string
          format: uuid
          description: "ID of the resource server these permissions belong to"
        permissions:
          type: array
          items:
            type: string
          description: "List of permission strings for this resource server"

    RoleSummary:
      type: object
      required: [id, name, ouId]
      properties:
        id:
          type: string
          format: uuid
          description: "Unique identifier for the role"
        name:
          type: string
          description: "Name of the role"
        description:
          type: string
          nullable: true
          description: "Optional description of the role"
        ouId:
          type: string
          format: uuid
          description: "ID of the organization unit this role belongs to"
        ouHandle:
          type: string
          readOnly: true
          description: "Handle of the organization unit this role belongs to"
        isReadOnly:
          type: boolean
          readOnly: true
          description: "Indicates if the role is defined in declarative configuration and cannot be modified"
        origin:
          type: string
          readOnly: true
          enum:
            - owned
            - shared
          description: "Present only when listing roles with the ouId query parameter: whether the organization unit owns this role or the role was shared to it."

    Role:
      type: object
      required: [id, name, ouId, permissions]
      properties:
        id:
          type: string
          format: uuid
          description: "Unique identifier for the role"
        name:
          type: string
          description: "Name of the role"
        description:
          type: string
          nullable: true
          description: "Optional description of the role"
        ouId:
          type: string
          format: uuid
          description: "ID of the organization unit this role belongs to"
        ouHandle:
          type: string
          readOnly: true
          description: "Handle of the organization unit this role belongs to"
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/ResourcePermissions'
          description: "List of resource permissions grouped by resource server. Always returned as an array, with an empty array when the role has no permissions."

    RoleWithAssignments:
      allOf:
        - $ref: '#/components/schemas/Role'
        - type: object
          properties:
            assignments:
              type: array
              items:
                $ref: '#/components/schemas/Assignment'
              description: "List of user and group assignments with display names"

    CreateRoleRequest:
      type: object
      required: [name, ouId]
      properties:
        name:
          type: string
          description: "Name of the role"
        description:
          type: string
          description: "Optional description of the role"
        ouId:
          type: string
          format: uuid
          description: "ID of the organization unit this role belongs to"
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/ResourcePermissions'
          description: "Optional list of initial permissions grouped by resource server"
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/AssignmentInput'
          description: "Optional list of initial user and group assignments"

    UpdateRoleRequest:
      type: object
      required: [name, ouId, permissions]
      properties:
        name:
          type: string
          description: "Name of the role"
        description:
          type: string
          description: "Optional description of the role"
        ouId:
          type: string
          format: uuid
          description: "ID of the organization unit this role belongs to"
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/ResourcePermissions'
          description: "List of resource permissions grouped by resource server"

    AssignmentsRequest:
      type: object
      required: [assignments]
      properties:
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/AssignmentInput'
          description: "List of user and group assignments"

    RoleListResponse:
      type: object
      properties:
        totalResults:
          type: integer
          description: "Number of results that match the listing operation."
          example: 8
        startIndex:
          type: integer
          description: "Index of the first element of the page, which will be equal to offset + 1."
          example: 1
        count:
          type: integer
          description: "Number of elements in the returned page."
          example: 5
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleSummary'
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'

    AssignmentListResponse:
      type: object
      properties:
        totalResults:
          type: integer
          description: "Number of results that match the listing operation."
          example: 20
        startIndex:
          type: integer
          description: "Index of the first element of the page, which will be equal to offset + 1."
          example: 1
        count:
          type: integer
          description: "Number of elements in the returned page."
          example: 10
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/Assignment'
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'

    Link:
      type: object
      properties:
        href:
          type: string
          example: "roles?offset=20&limit=10"
        rel:
          type: string
          example: "next"

    ShareRequest:
      type: object
      description: |
        Exactly one of two target-scope modes must be selected: root-targeting (`allRoots` or
        `rootOuIds`) or children-targeting (`allChildren` or `ouIds`).
      properties:
        ouId:
          type: string
          format: uuid
          description: |
            The organization unit performing this share. Optional; defaults to the role's own
            owning organization unit when omitted. Root-targeting mode is only valid when this is
            the role's own owning organization unit. Children-targeting mode is valid for any
            organization unit currently visible for the role: the role's own owning organization
            unit (always trivially visible, so an owner may use this mode directly with no
            preceding root-targeting call), or any other organization unit already made visible by
            an earlier call to this same action.
        allRoots:
          type: boolean
          description: Share to every current and future Root organization unit. Root-targeting mode.
        rootOuIds:
          type: array
          items:
            type: string
            format: uuid
          description: Share to these specific Root organization units. Root-targeting mode.
        excludedRootOuIds:
          type: array
          items:
            type: string
            format: uuid
          description: |
            Carves these Root organization units, and their entire subtrees, out of an `allRoots`
            share (e.g. "share to all Roots except this one"). Each must itself be a Root
            organization unit. Ignored unless `allRoots` is true.
        allChildren:
          type: boolean
          description: |
            Share to every organization unit in ouId's subtree, including ones created afterward,
            any depth, in one grant. Children-targeting mode.
        ouIds:
          type: array
          items:
            type: string
            format: uuid
          description: |
            Share to these specific organization units. Each must be ouId's direct child; reaching
            a grandchild selectively requires that child to issue its own children-targeting call
            in turn. Ignored when `allChildren` is true. Children-targeting mode.
        excludedOuIds:
          type: array
          items:
            type: string
            format: uuid
          description: |
            Carves these organization units, and their entire subtrees, out of an `allChildren`
            share (e.g. "share to all children except these"). Each must be ouId itself or within
            its subtree. Ignored unless `allChildren` is true.
        editableFields:
          type: array
          items:
            type: string
            enum:
              - "assignments"
              - "assignments.user"
              - "assignments.group"
              - "assignments.app"
              - "assignments.agent"
          description: |
            Templated fields made editable through this grant. Omit for "everything": every field,
            when `ouId` is the role's own owning organization unit; exactly `ouId`'s own current
            editable set, when `ouId` is a sharee reshare — a reshare may only narrow this set
            relative to its own, never widen it (`SHR-1008` if it tries to).

    ShareGrant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        stage:
          type: string
          enum:
            - share
            - reshare
          description: |
            Who issued this grant, not which target-scope mode it used: `share` for a grant issued
            by the role's own owning organization unit (whether root-targeting or children-targeting
            mode), `reshare` for a grant issued by a previously-visible sharee organization unit
            distributing further within its own subtree.
        targetScope:
          type: string
          enum:
            - all_roots
            - root
            - all_children
            - ou
          description: The breadth of organization units this grant targets.
        targetOuId:
          type: string
          format: uuid
        owningOuId:
          type: string
          format: uuid
          description: The organization unit that owns the shared role.
        excludedOuIds:
          type: array
          items:
            type: string
            format: uuid
          description: |
            Organization units (and their subtrees) carved out of this grant. Only ever non-empty
            for the `all_roots`/`all_children` target scopes.
        editableFields:
          type: array
          items:
            type: string
          description: The templated fields made editable through this grant (see ShareRequest.editableFields).

    ShareGrantListResponse:
      type: object
      properties:
        grants:
          type: array
          items:
            $ref: '#/components/schemas/ShareGrant'

    EditableFieldsResponse:
      type: object
      required: [fields]
      properties:
        fields:
          type: array
          items:
            type: string
          description: The templated fields currently editable by the requested organization unit.

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: "Error code. The prefix identifies the service that produced the error, for example ROL for role management or SAZ for system authorization."
          example: "ROL-1001"
        message:
          $ref: '#/components/schemas/I18nMessage'
        description:
          $ref: '#/components/schemas/I18nMessage'

    I18nMessage:
      type: object
      description: Internationalized message with translation key and default value.
      required:
        - key
        - defaultValue
      properties:
        key:
          type: string
          description: Translation key for fetching localized message.
        defaultValue:
          type: string
          description: Default message in English (fallback).
