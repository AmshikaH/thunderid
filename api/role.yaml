openapi: 3.0.3
info:
  title: Role Management API
  version: "1.0"
  description: Define and assign roles for permission-based access control. Roles aggregate permissions derived from resource server scopes and can be assigned directly to users or groups.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: https://{host}:{port}
    variables:
      host:
        default: "localhost"
      port:
        default: "8090"

tags:
  - name: Roles
    description: |
      Create roles, define their permission scopes, and assign them to users or groups.

      **Core vs. templated configuration.** A role is owned by a single organization unit (the
      `ouId` on the role) and splits into two parts:
      - **Core config**: `name`, `description`, and `permissions`. Always resolved from, and
        editable only by, the role's owning organization unit, regardless of any share grant.
        `PUT /roles/{id}` rejects a caller whose own organization unit does not own the existing
        role with `SHR-1007`. `DELETE /roles/{id}` rejects the same situation with `ROL-1024`
        instead — a role-specific error, since deletion is its own resource-type-meaningful
        violation ("this role cannot be deleted by this organization unit"), not a core-config
        edit. `POST /roles` rejects a caller whose own organization unit does not match the
        requested `ouId` with `ROL-1023` — there is no existing role yet for `SHR-1007`'s
        ownership framing to apply to; this is the same OU-reach check the read/list/assignment
        paths use. None of these three endpoints accept an
        acting-OU parameter — unlike the assignment endpoints below, there is no way for a sharee
        to even name itself as the acting party for core config.
      - **Templated config**: `assignments` (users, groups, apps, agents). Each organization unit
        the role is shared to keeps its own independent set of assignments, separate from the
        owner's own and from any other sharee's. A new sharee starts with zero assignments, not a
        copy of the owner's. There are four templated fields, one per assignee type
        (`assignments.user`, `assignments.group`, `assignments.app`, `assignments.agent`), plus a
        blanket `assignments` field covering every type at once: which of these a sharee may edit
        is decided by the share grant that made the role visible to it (see `editableFields` in the
        "Role sharing" section below), not by a separate setting.

      See the "Role sharing" section below for how a role is shared to Root organization unit(s)
      and reshared into a Root's subtree, and how each grant decides which `assignments.*` fields
      the organization unit it targets may edit.

      **API access scopes.** Three OAuth scopes grant access to this API: `system` (unrestricted —
      may act on any role in any organization unit), `system:roles` (full role-management access —
      list, read, create, update, delete, manage assignments), and `system:roles:view` (read-only —
      list, read, and read assignments/share-grants/editable-fields), each of the latter two
      confined to the token's own organization unit — the organization unit its issuing client
      application belongs to, same as the OU/user/group/user-type/agent-type APIs' own view/manage
      split. Whichever of these two scopes a caller holds, every organization-unit-shaped input on
      the request — the `ouId` a `GET /roles`/`GET /roles?ouId=` call names, the `ouId` a new role
      is created in, the existing (and, on move, destination) owning organization unit of a role
      being updated or deleted, and the acting `ouId` on assignment endpoints — must equal that
      caller's own organization unit, or the call is rejected with `ROL-1023`. `GET /roles` with no
      `ouId` reflects this automatically: a `system` token gets the unrestricted, deployment-wide
      listing; a `system:roles`/`system:roles:view` token gets exactly what
      `?ouId=<its own organization unit>` would return. The one exception is reading a single role
      by id (`GET /roles/{id}`): a role outside the caller's own organization unit is still viewable
      if it has been shared to that organization unit — core config can still never be edited or the
      role deleted this way, only viewed, per the sharing model above.
  - name: Role sharing
    description: |
      Sharing an owned role makes it visible to other organization units without duplicating it:
      a shared role is always the same `id`, with core config (`name`, `permissions`) resolved
      from the owning organization unit and `assignments` resolved independently per organization
      unit.

      Sharing is a single action, `POST /roles/{id}/share-grants`, with two target-scope modes
      selected by which fields of the request body are populated. `ouId` names the organization
      unit performing this share; it defaults to the role's own owning organization unit when
      omitted.
      1. **Root-targeting** (`allRoots`, or an explicit `rootOuIds` list; a Root is an organization
         unit with no parent): the only mode that crosses from the owning organization unit's own
         subtree into a different one, either a foreign Root's tree, or (when the owner is itself
         not a Root) the owner's own Root, as a step toward then fanning out sideways within that
         tree via a children-targeting call. Only valid when `ouId` is the role's own owning
         organization unit — a sharee has no standing to name an arbitrary Root as a target.
      2. **Children-targeting** (`allChildren`, including organization units created afterward, or
         an explicit `ouIds` list of `ouId`'s direct children): redistributes the role from `ouId`
         (any organization unit currently visible for it) into `ouId`'s own subtree. The role's own
         owning organization unit is always trivially visible to itself, so an owner, Root or not,
         may use this mode directly with no preceding root-targeting call — this is the single-call
         path for "share this role with my own children". Any other organization unit must already
         be visible via an earlier call to this same action, in either mode — a sharee resharing
         what was shared to it is not a different action or a looser check, it is this exact same
         call and the exact same visibility rule. An explicit `ouIds` entry must be `ouId`'s direct
         child; reaching a grandchild selectively requires that child to issue its own
         children-targeting call in turn, so access delegates one hop at a time and never
         implicitly skips a level. `allChildren` has no such restriction: it is a single grant
         covering the entire subtree, any depth, forever (subject to its exclusion list).

      Both `allRoots` and `allChildren` support an "all except" pattern: `excludedRootOuIds` and
      `excludedOuIds` respectively carve specific organization units, and their entire subtrees,
      out of an otherwise blanket share.

      Visibility is resolved by walking the chain from the role's tree root down to the
      organization unit in question and confirming every hop is backed by a valid grant (or the
      owner's own unconditional access, wherever it sits in that chain): an organization unit is
      never visible merely because some grant happens to name it, its parent must be visible too,
      and must have actually granted it. A broken or excluded link anywhere in a multi-hop
      delegation chain cuts off every organization unit below it.

      `POST /roles/{id}/share-grants` returns the grant(s) it creates; `GET /roles/{id}/share-grants`
      lists every grant recorded for a role, and `DELETE /roles/{id}/share-grants/{grantId}` revokes
      one, removing that organization unit's (or subtree's) access, including its own `assignments`
      for the role.

      **Editability is a property of the grant itself.** Each share/reshare request may set
      `editableFields`, naming which of the five templated fields (`assignments` and the four
      `assignments.*` types) the target organization unit(s) may edit:
      - Omitted (or empty), when `ouId` is the role's own owning organization unit: every templated
        field is editable — a first share defaults open.
      - Omitted (or empty), when `ouId` is a sharee reshare: exactly whatever `ouId` itself is
        currently permitted to edit, no more and no less.
      - An explicit list, when `ouId` is the owner: exactly that list, validated against the
        declared fields (`SHR-1006` for an unrecognized one).
      - An explicit list, when `ouId` is a sharee reshare: must be a subset of what `ouId` itself
        currently holds — **a reshare can only narrow editability, never widen it**. Naming a field
        `ouId` cannot itself edit is rejected with `SHR-1008`.

      A grant's `editableFields` is fixed at creation time; it does not change later. To change
      what an organization unit may edit, revoke its grant (`DELETE .../share-grants/{grantId}`)
      and share again with the new list.

      `GET /roles/{id}/editable-fields` (optionally `?ouId=`, defaulting to the role's own owning
      organization unit) returns the templated fields currently editable by that organization unit
      for that role — the owner always sees every field; a sharee sees whatever its own nearest
      grant allows.

security:
  - OAuth2: [system]

paths:
  /roles:
    get:
      tags:
        - Roles
      summary: List roles
      description: |
        Without `ouId`, lists every role in the deployment. With `ouId`, lists only the roles
        owned by or shared to that organization unit, each tagged with `origin` (`owned` or
        `shared`). See the "Role sharing" section.
      parameters:
        - $ref: '#/components/parameters/ouIdListingQueryParam'
        - $ref: '#/components/parameters/limitQueryParam'
        - $ref: '#/components/parameters/offsetQueryParam'
      responses:
        "200":
          description: List of roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListResponse'
              examples:
                deployment-wide:
                  summary: Without ouId (deployment-wide listing, no origin)
                  value:
                    totalResults: 5
                    startIndex: 1
                    count: 2
                    roles:
                      - id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                        name: "front-desk-agent"
                        description: "Front desk agent role with booking and customer management permissions"
                        ouId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
                        ouHandle: "default"
                        isReadOnly: false
                      - id: "257e528f-eb24-48b6-884d-20460e190957"
                        name: "hotel-manager"
                        description: "Hotel manager with full property access"
                        ouId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
                        ouHandle: "default"
                        isReadOnly: true
                    links:
                      - href: "roles?offset=2&limit=2"
                        rel: "next"
                owned-and-shared:
                  summary: With ouId (owned + shared, with origin)
                  value:
                    totalResults: 2
                    startIndex: 1
                    count: 2
                    roles:
                      - id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                        name: "front-desk-agent"
                        description: "Front desk agent role with booking and customer management permissions"
                        ouId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
                        ouHandle: "default"
                        isReadOnly: false
                        origin: "owned"
                      - id: "9c2e1a5c-2b1e-4f0a-8c1a-5a6b7c8d9e0f"
                        name: "regional-manager"
                        description: "Shared from the parent organization"
                        ouId: "6f5e4d3c-2b1a-4c5d-8e9f-0a1b2c3d4e5f"
                        ouHandle: "north-region"
                        isReadOnly: false
                        origin: "shared"
                    links: []
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid-request-format:
                  summary: Invalid request format
                  value:
                    code: "ROL-1001"
                    message:
                      key: "error.roleservice.invalid_request_format"
                      defaultValue: "Invalid request format"
                    description:
                      key: "error.roleservice.invalid_request_format_description"
                      defaultValue: "The request body is malformed or contains invalid data"
                invalid-limit:
                  summary: Invalid limit parameter
                  value:
                    code: "ROL-1008"
                    message:
                      key: "error.roleservice.invalid_limit_parameter"
                      defaultValue: "Invalid limit parameter"
                    description:
                      key: "error.roleservice.invalid_limit_parameter_description"
                      defaultValue: "The limit parameter must be a positive integer"
                invalid-offset:
                  summary: Invalid offset parameter
                  value:
                    code: "ROL-1009"
                    message:
                      key: "error.roleservice.invalid_offset_parameter"
                      defaultValue: "Invalid offset parameter"
                    description:
                      key: "error.roleservice.invalid_offset_parameter_description"
                      defaultValue: "The offset parameter must be a non-negative integer"
        "403":
          description: |
            Forbidden. A system:roles-scoped caller passed an `ouId` other than its own
            organization unit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "ROL-1023"
                message:
                  key: "error.roleservice.role_outside_own_ou_scope"
                  defaultValue: "Outside the caller's organization unit scope"
                description:
                  key: "error.roleservice.role_outside_own_ou_scope_description"
                  defaultValue: "The system:roles scope confines the caller to its own token-issued organization unit; the requested organization unit is outside that scope"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "ROL-5000"
                message:
                  key: "error.internal_server_error"
                  defaultValue: "Internal server error"
                description:
                  key: "error.internal_server_error_description"
                  defaultValue: "An unexpected error occurred while processing the request"

    post:
      tags:
        - Roles
      summary: Create a new role
      description: Creates a new role with optional initial permissions and assignments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
            example:
              name: "front-desk-agent"
              description: "Front desk agent role with booking and customer management permissions"
              ouId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
              permissions:
                - resourceServerId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                  permissions:
                    - "create_reservation"
                    - "view_reservation"
                    - "update_reservation"
                    - "check_in_guest"
                    - "check_out_guest"
                - resourceServerId: "7b8c9d0e-1f2a-3b4c-5d6e-7f8a9b0c1d2e"
                  permissions:
                    - "process_payment"
                    - "view_payment"
                    - "view_customer_profile"
                    - "update_customer_profile"
              assignments:
                - type: "user"
                  id: "7a4b1f8e-5c69-4b60-9232-2b0aaf65ef3c"
                - type: "group"
                  id: "6b1e7b8d-7e19-41eb-8fa2-c0ee5bb67a94"
      responses:
        "201":
          description: Role created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleWithAssignments'
              example:
                id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                name: "front-desk-agent"
                description: "Front desk agent role with booking and customer management permissions"
                ouId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
                ouHandle: "default"
                permissions:
                  - resourceServerId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    permissions:
                      - "create_reservation"
                      - "view_reservation"
                      - "update_reservation"
                      - "check_in_guest"
                      - "check_out_guest"
                  - resourceServerId: "7b8c9d0e-1f2a-3b4c-5d6e-7f8a9b0c1d2e"
                    permissions:
                      - "process_payment"
                      - "view_payment"
                      - "view_customer_profile"
                      - "update_customer_profile"
                assignments:
                  - type: "user"
                    id: "7a4b1f8e-5c69-4b60-9232-2b0aaf65ef3c"
                    display: "John Doe"
                  - type: "group"
                    id: "6b1e7b8d-7e19-41eb-8fa2-c0ee5bb67a94"
                    display: "Front Desk Team"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid-request-format:
                  summary: Invalid request format
                  value:
                    code: "ROL-1001"
                    message:
                      key: "error.roleservice.invalid_request_format"
                      defaultValue: "Invalid request format"
                    description:
                      key: "error.roleservice.invalid_request_format_description"
                      defaultValue: "The request body is malformed or contains invalid data"
                invalid-assignment-id:
                  summary: Invalid assignment ID
                  value:
                    code: "ROL-1007"
                    message:
                      key: "error.roleservice.invalid_assignment_id"
                      defaultValue: "Invalid assignment ID"
                    description:
                      key: "error.roleservice.invalid_assignment_id_description"
                      defaultValue: "One or more assignment IDs in the request do not exist or do not match the claimed type"
                ou-not-found:
                  summary: Organization unit not found
                  value:
                    code: "ROL-1005"
                    message:
                      key: "error.roleservice.organization_unit_not_found"
                      defaultValue: "Organization unit not found"
                    description:
                      key: "error.roleservice.organization_unit_not_found_description"
                      defaultValue: "Organization unit not found"
                invalid-permissions:
                  summary: Invalid permissions
                  value:
                    code: "ROL-1012"
                    message:
                      key: "error.roleservice.invalid_permissions"
                      defaultValue: "Invalid permissions"
                    description:
                      key: "error.roleservice.invalid_permissions_description"
                      defaultValue: "One or more permissions do not exist in the resource management system"
                declarative-mode:
                  summary: Role creation not allowed in declarative-only mode
                  value:
                    code: "ROL-1015"
                    message:
                      key: "error.roleservice.cannot_create_role_in_declarative_only_mode"
                      defaultValue: "Cannot create role in declarative-only mode"
                    description:
                      key: "error.roleservice.cannot_create_role_in_declarative_only_mode_description"
                      defaultValue: "Role creation is not allowed when running in declarative-only mode. Roles must be defined in declarative configuration files"
        "403":
          description: |
            Forbidden. Either the caller's organization unit does not match the requested `ouId`
            and the caller does not hold the deployment's unrestricted permission (a role may only
            be created for the organization unit that will own it), or the requested permissions
            would exceed what the caller itself holds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                outside-own-ou-scope:
                  summary: The caller's own organization unit does not match the requested ouId
                  value:
                    code: "ROL-1023"
                    message:
                      key: "error.roleservice.role_outside_own_ou_scope"
                      defaultValue: "Outside the caller's organization unit scope"
                    description:
                      key: "error.roleservice.role_outside_own_ou_scope_description"
                      defaultValue: "The system:roles/system:roles:view scope confines the caller to its own token-issued organization unit; the requested organization unit is outside that scope"
                insufficient-privileges:
                  summary: The requested permissions exceed what the caller itself holds
                  value:
                    code: "SAZ-4030"
                    message:
                      key: "error.sysauthz.grant_not_permitted"
                      defaultValue: "Insufficient privileges to grant these permissions"
                    description:
                      key: "error.sysauthz.grant_not_permitted_description"
                      defaultValue: "The operation would grant permissions that the caller does not hold"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "ROL-1004"
                message:
                  key: "error.roleservice.role_name_conflict"
                  defaultValue: "Role name conflict"
                description:
                  key: "error.roleservice.role_name_conflict_description"
                  defaultValue: "A role with the same name exists under the same organization unit"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "ROL-5000"
                message:
                  key: "error.internal_server_error"
                  defaultValue: "Internal server error"
                description:
                  key: "error.internal_server_error_description"
                  defaultValue: "An unexpected error occurred while processing the request"

  /roles/{id}:
    get:
      tags:
        - Roles
      summary: Get role details
      description: Returns role metadata with permissions list
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Role details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
              example:
                id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                name: "front-desk-agent"
                description: "Front desk agent role with booking and customer management permissions"
                ouId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
                ouHandle: "default"
                permissions:
                  - resourceServerId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    permissions:
                      - "create_reservation"
                      - "view_reservation"
                  - resourceServerId: "7b8c9d0e-1f2a-3b4c-5d6e-7f8a9b0c1d2e"
                    permissions:
                      - "process_payment"
                      - "view_customer_profile"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "ROL-1002"
                message:
                  key: "error.roleservice.missing_role_id"
                  defaultValue: "Invalid request format"
                description:
                  key: "error.roleservice.missing_role_id_description"
                  defaultValue: "Role ID is required"
        "403":
          description: |
            Forbidden. A system:roles-scoped caller requested a role owned by a different
            organization unit, and it has not been shared to the caller's own organization unit
            either.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "ROL-1023"
                message:
                  key: "error.roleservice.role_outside_own_ou_scope"
                  defaultValue: "Outside the caller's organization unit scope"
                description:
                  key: "error.roleservice.role_outside_own_ou_scope_description"
                  defaultValue: "The system:roles scope confines the caller to its own token-issued organization unit; the requested organization unit is outside that scope"
        "404":
          description: Role not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "ROL-1003"
                message:
                  key: "error.roleservice.role_not_found"
                  defaultValue: "Role not found"
                description:
                  key: "error.roleservice.role_not_found_description"
                  defaultValue: "The role with the specified id does not exist"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "ROL-5000"
                message:
                  key: "error.internal_server_error"
                  defaultValue: "Internal server error"
                description:
                  key: "error.internal_server_error_description"
                  defaultValue: "An unexpected error occurred while processing the request"

    put:
      tags:
        - Roles
      summary: Update role
      description: Updates role name, description, organization unit, and permissions
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
            example:
              name: "senior-front-desk-agent"
              description: "Senior front desk agent with additional permissions"
              ouId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
              permissions:
                - resourceServerId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                  permissions:
                    - "create_reservation"
                    - "view_reservation"
                    - "update_reservation"
                    - "cancel_reservation"
                - resourceServerId: "7b8c9d0e-1f2a-3b4c-5d6e-7f8a9b0c1d2e"
                  permissions:
                    - "process_payment"
                    - "view_payment"
                    - "refund_payment"
                    - "view_customer_profile"
                    - "update_customer_profile"
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
              example:
                id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                name: "senior-front-desk-agent"
                description: "Senior front desk agent with additional permissions"
                ouId: "a839f4bd-39dc-4eaa-b5cc-210d8ecaee87"
                ouHandle: "default"
                permissions:
                  - resourceServerId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    permissions:
                      - "create_reservation"
                      - "view_reservation"
                      - "update_reservation"
                      - "cancel_reservation"
                  - resourceServerId: "7b8c9d0e-1f2a-3b4c-5d6e-7f8a9b0c1d2e"
                    permissions:
                      - "process_payment"
                      - "view_payment"
                      - "refund_payment"
                      - "view_customer_profile"
                      - "update_customer_profile"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing-role-id:
                  summary: Missing role ID
                  value:
                    code: "ROL-1002"
                    message:
                      key: "error.roleservice.missing_role_id"
                      defaultValue: "Invalid request format"
                    description:
                      key: "error.roleservice.missing_role_id_description"
                      defaultValue: "Role ID is required"
                invalid-request-format:
                  summary: Invalid request format
                  value:
                    code: "ROL-1001"
                    message:
